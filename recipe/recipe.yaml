schema_version: 1

context:
  name: DracoPy
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/seung-lab/DracoPy/archive/refs/tags/${{ version }}.tar.gz
  sha256: 860d71d3986b9a7983f5972e4914655f886cddec36e720bf07f115721e744709
  patches:
    # Remove once upstream supports linking against an installed Draco library.
    - patches/0001-use-system-draco.patch

build:
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - cython
    - draco
    - numpy
    - pip
    - setuptools
    - wheel
  run:
    - python

tests:
  - python:
      imports:
        - DracoPy
  - script:
      - pip check
      - python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python

about:
  homepage: https://github.com/seung-lab/DracoPy
  summary: Python wrapper for Google's Draco mesh compression library
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeongseok-meta
